name: Android APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build SANKUR APK
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    env:
      ANDROID_HOME: ${{ runner.home }}/android-sdk
      ANDROID_SDK_ROOT: ${{ runner.home }}/android-sdk
      NDK_VERSION: 25.2.9519653
      CMAKE_VERSION: 3.22.1

    steps:
      - name: Repository indir
        uses: actions/checkout@v4

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK, NDK ve CMake kur
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          cd "$ANDROID_HOME/cmdline-tools"
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O tools.zip
          unzip -q tools.zip
          rm -f tools.zip
          mv cmdline-tools latest
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" \
            "platform-tools" "platforms;android-34" "build-tools;34.0.0" \
            "ndk;$NDK_VERSION" "cmake;$CMAKE_VERSION"

      - name: Gradle 8.5 kur
        shell: bash
        run: |
          set -euo pipefail
          wget -q https://services.gradle.org/distributions/gradle-8.5-bin.zip -O gradle.zip
          unzip -q gradle.zip
          rm gradle.zip
          echo "$GITHUB_WORKSPACE/gradle-8.5/bin" >> "$GITHUB_PATH"

      - name: Android projesini hazırla ve kaynakları bul
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/cpp app/src/main/res/values
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties

          # Repodaki C/C++ kaynaklarını uygulama klasörüne kopyala.
          while IFS= read -r -d '' f; do
            case "$f" in ./app/src/main/cpp/*) continue ;; esac
            cp --parents "$f" app/src/main/cpp/
          done < <(find . -type f \( -name '*.c' -o -name '*.cc' -o -name '*.cpp' -o -name '*.cxx' -o -name '*.h' -o -name '*.hpp' \) \
            ! -path './.git/*' ! -path './.github/*' ! -path './app/build/*' ! -path './gradle-8.5/*' -print0

          # Repoda derlenebilir C/C++ kaynak yoksa APK oluşturmayı durdurma:
          # Android NativeActivity için çalışan boş/temel giriş dosyası üret.
          SRC_COUNT=$(find app/src/main/cpp -type f \( -name '*.c' -o -name '*.cc' -o -name '*.cpp' -o -name '*.cxx' \) ! -name 'android_native_app_glue.c' | wc -l)
          if [ "$SRC_COUNT" -eq 0 ]; then
            cat > app/src/main/cpp/main.cpp <<'CPP'
          #include <android_native_app_glue.h>
          #include <android/log.h>
          #include <unistd.h>
          #define LOGI(...) __android_log_print(ANDROID_LOG_INFO, "SANKUR", __VA_ARGS__)
          static void handle_cmd(android_app* app, int32_t cmd) {
              if (cmd == APP_CMD_INIT_WINDOW && app->window) LOGI("NativeActivity başladı");
          }
          void android_main(android_app* app) {
              app->onAppCmd = handle_cmd;
              while (true) {
                  int events = 0;
                  android_poll_source* source = nullptr;
                  int ident = ALooper_pollOnce(-1, nullptr, &events, (void**)&source);
                  if (ident >= 0 && source) source->process(app, source);
                  if (app->destroyRequested) return;
              }
          }
          CPP
            echo "Repoda C/C++ kaynak bulunamadı; temel NativeActivity main.cpp oluşturuldu."
          fi

          cat > settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = 'SANKUR'
          include ':app'
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF

          cat > app/build.gradle <<'EOF'
          plugins { id 'com.android.application' version '8.2.2' }
          android {
              namespace 'com.sankur.oyun'
              compileSdk 34
              ndkVersion '25.2.9519653'
              defaultConfig {
                  applicationId 'com.sankur.oyun'
                  minSdk 24
                  targetSdk 28
                  versionCode 1
                  versionName '1.0'
              }
              externalNativeBuild {
                  cmake {
                      path file('src/main/cpp/CMakeLists.txt')
                      version '3.22.1'
                  }
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-feature android:glEsVersion="0x00020000" android:required="false"/>
              <application android:label="SANKUR" android:hasCode="false"
                  android:theme="@android:style/Theme.Material.NoActionBar">
                  <activity android:name="android.app.NativeActivity" android:exported="true"
                      android:configChanges="orientation|keyboardHidden|screenSize">
                      <meta-data android:name="android.app.lib_name" android:value="game"/>
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/cpp/CMakeLists.txt <<'EOF'
          cmake_minimum_required(VERSION 3.22.1)
          project(game LANGUAGES C CXX)
          set(CMAKE_CXX_STANDARD 17)
          set(CMAKE_CXX_STANDARD_REQUIRED ON)
          set(NATIVE_GLUE "${ANDROID_NDK}/sources/android/native_app_glue/android_native_app_glue.c")
          if(NOT EXISTS "${NATIVE_GLUE}")
              message(FATAL_ERROR "android_native_app_glue.c bulunamadı: ${NATIVE_GLUE}")
          endif()
          file(GLOB_RECURSE GAME_SOURCES CONFIGURE_DEPENDS
              "${CMAKE_CURRENT_SOURCE_DIR}/*.c"
              "${CMAKE_CURRENT_SOURCE_DIR}/*.cc"
              "${CMAKE_CURRENT_SOURCE_DIR}/*.cpp"
              "${CMAKE_CURRENT_SOURCE_DIR}/*.cxx")
          list(FILTER GAME_SOURCES EXCLUDE REGEX "/android_native_app_glue\\.c$")
          add_library(game SHARED ${GAME_SOURCES} "${NATIVE_GLUE}")
          target_include_directories(game PRIVATE "${ANDROID_NDK}/sources/android/native_app_glue")
          target_link_libraries(game android log EGL GLESv2)
          EOF

      - name: Release APK derle
        shell: bash
        run: gradle --no-daemon --stacktrace clean assembleRelease

      - name: APK artifact yükle
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: SANKUR-APK
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
          
