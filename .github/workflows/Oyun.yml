name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Android APK
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    env:
      ANDROID_NDK_VERSION: '25.2.9519653'
      ANDROID_CMAKE_VERSION: '3.22.1'

    steps:
      - name: Repository indir
        uses: actions/checkout@v7

      - name: Java 17 kur
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK araçlarını kur
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Android SDK, NDK ve CMake paketlerini kur
        shell: bash
        run: |
          set -euo pipefail

          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-$HOME/.android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

          sdkmanager --sdk_root="$SDK_ROOT" --install \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;${ANDROID_NDK_VERSION}" \
            "cmake;${ANDROID_CMAKE_VERSION}"

          echo "Android SDK: $SDK_ROOT"
          echo "NDK: $SDK_ROOT/ndk/${ANDROID_NDK_VERSION}"
          echo "CMake: $ANDROID_CMAKE_VERSION"

      - name: Gradle 8.5 kur
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.5'

      - name: Android proje iskeletini hazırla
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p app/src/main/cpp app/src/main/res/values

          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-$HOME/.android/sdk}}"
          printf 'sdk.dir=%s\n' "$SDK_ROOT" > local.properties

          # Repository içindeki C/C++ kaynak ve başlık dosyalarını Android
          # NativeActivity projesine kopyala. Zaten hedef klasörde olanları kopyalama.
          while IFS= read -r -d '' file; do
            case "$file" in
              ./app/src/main/cpp/*) continue ;;
            esac
            cp --parents "$file" app/src/main/cpp/
          done < <(find . -type f \
            \( -name '*.c' -o -name '*.cc' -o -name '*.cpp' -o -name '*.cxx' \
               -o -name '*.h' -o -name '*.hh' -o -name '*.hpp' -o -name '*.hxx' \) \
            ! -path './.git/*' \
            ! -path './.github/*' \
            ! -path './build/*' \
            ! -path './.gradle/*' \
            ! -path './app/build/*' \
            ! -path './app/.cxx/*' \
            -print0)

          SOURCE_COUNT="$(find app/src/main/cpp -type f \
            \( -name '*.c' -o -name '*.cc' -o -name '*.cpp' -o -name '*.cxx' \) \
            ! -name 'android_native_app_glue.c' | wc -l)"
          if [ "$SOURCE_COUNT" -eq 0 ]; then
            echo 'HATA: Derlenecek C/C++ kaynak dosyası bulunamadı.'
            exit 1
          fi
          echo "Bulunan C/C++ kaynak dosyası: $SOURCE_COUNT"

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = 'SANKUR'
          include ':app'
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
          org.gradle.parallel=true
          android.useAndroidX=true
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.2.2'
          }

          android {
              namespace 'com.sankur.oyun'
              compileSdk 34
              ndkVersion '25.2.9519653'

              defaultConfig {
                  applicationId 'com.sankur.oyun'
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName '1.0'

                  externalNativeBuild {
                      cmake {
                          cppFlags '-std=c++17'
                      }
                  }
              }

              externalNativeBuild {
                  cmake {
                      path file('src/main/cpp/CMakeLists.txt')
                      version '3.22.1'
                  }
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-feature android:glEsVersion="0x00020000" android:required="false" />
              <application
                  android:allowBackup="false"
                  android:label="SANKUR"
                  android:hasCode="false"
                  android:theme="@android:style/Theme.Material.NoActionBar">
                  <activity
                      android:name="android.app.NativeActivity"
                      android:exported="true"
                      android:configChanges="orientation|keyboardHidden|screenSize">
                      <meta-data
                          android:name="android.app.lib_name"
                          android:value="game" />
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/cpp/CMakeLists.txt <<'EOF'
          cmake_minimum_required(VERSION 3.22.1)
          project(game LANGUAGES C CXX)

          set(CMAKE_CXX_STANDARD 17)
          set(CMAKE_CXX_STANDARD_REQUIRED ON)
          set(CMAKE_CXX_EXTENSIONS OFF)

          # NDK yolunu Gradle/CMake tarafındaki standart değişkenlerden bul.
          if(DEFINED ANDROID_NDK AND EXISTS "${ANDROID_NDK}/sources/android/native_app_glue/android_native_app_glue.c")
              set(SANKUR_NDK "${ANDROID_NDK}")
          elseif(DEFINED CMAKE_ANDROID_NDK AND EXISTS "${CMAKE_ANDROID_NDK}/sources/android/native_app_glue/android_native_app_glue.c")
              set(SANKUR_NDK "${CMAKE_ANDROID_NDK}")
          else()
              message(FATAL_ERROR "Android NDK veya android_native_app_glue bulunamadı. NDK sürümünü kontrol edin.")
          endif()

          # Oyun motorunun C/C++ kaynak dosyalarını otomatik bul.
          file(GLOB_RECURSE GAME_SOURCES CONFIGURE_DEPENDS
              "${CMAKE_CURRENT_SOURCE_DIR}/*.c"
              "${CMAKE_CURRENT_SOURCE_DIR}/*.cc"
              "${CMAKE_CURRENT_SOURCE_DIR}/*.cpp"
              "${CMAKE_CURRENT_SOURCE_DIR}/*.cxx"
          )

          list(FILTER GAME_SOURCES EXCLUDE REGEX "/android_native_app_glue\\.c$")

          if(NOT GAME_SOURCES)
              message(FATAL_ERROR "app/src/main/cpp içinde derlenecek C/C++ kaynak kodu bulunamadı.")
          endif()

          # NativeActivity yaşam döngüsü ve dokunmatik giriş desteği.
          set(NATIVE_APP_GLUE_DIR "${SANKUR_NDK}/sources/android/native_app_glue")
          add_library(native_app_glue STATIC
              "${NATIVE_APP_GLUE_DIR}/android_native_app_glue.c"
          )
          target_include_directories(native_app_glue PUBLIC "${NATIVE_APP_GLUE_DIR}")

          add_library(game SHARED ${GAME_SOURCES})

          # Kaynakların bulunduğu klasörleri include yoluna ekle.
          file(GLOB_RECURSE GAME_INCLUDE_DIRS LIST_DIRECTORIES true
              "${CMAKE_CURRENT_SOURCE_DIR}/*"
          )
          foreach(INCLUDE_DIR ${GAME_INCLUDE_DIRS})
              if(IS_DIRECTORY "${INCLUDE_DIR}")
                  target_include_directories(game PRIVATE "${INCLUDE_DIR}")
              endif()
          endforeach()

          find_library(ANDROID_LIB android REQUIRED)
          find_library(LOG_LIB log REQUIRED)
          find_library(EGL_LIB EGL REQUIRED)
          find_library(GLES_LIB GLESv2 REQUIRED)

          target_link_libraries(game PRIVATE
              native_app_glue
              ${ANDROID_LIB}
              ${LOG_LIB}
              ${EGL_LIB}
              ${GLES_LIB}
          )

          # Linker'ın NativeActivity giriş sembolünü native glue içinden çıkarmasını sağla.
          target_link_options(game PRIVATE "-Wl,-u,ANativeActivity_onCreate")
          EOF

      - name: Release APK derle
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace --warning-mode all clean assembleRelease

      - name: APK dosyasını yükle
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: SANKUR-APK
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Hata raporlarını yükle
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: SANKUR-build-diagnostics
          path: |
            app/build/reports/**
            app/.cxx/**
            app/build/outputs/logs/**
          if-no-files-found: ignore
          retention-days: 7
          
